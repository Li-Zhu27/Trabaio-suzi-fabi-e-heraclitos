<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>teste teste
    </h1>





<section id="cadastro" class="mb-5">
    <h2>Cadastro</h2>

    <form id="form-cadastro">
        <div class="mb-3">
            <label for="nome" class="form-label">
                Nome completo:
            </label>
            <input
                type="text"
                id="nome"
                name="nome"
                class="form-control"
                placeholder="Digite seu nome completo"
                required
            >
        </div>

        <div class="mb-3">
            <label for="cpf-cnpj" class="form-label">
                CPF/CNPJ:
            </label>
            <input
                type="text"
                id="cpf-cnpj"
                name="cpf-cnpj"
                class="form-control"
                placeholder="Digite seu CPF ou CNPJ"
                required
            >
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">
                E-mail:
            </label>
            <input
                type="email"
                id="email"
                name="email"
                class="form-control"
                placeholder="Digite seu e-mail"
                required
            >
        </div>

        <div class="mb-3">
            <label for="senha" class="form-label">
                Senha:
            </label>
            <input
                type="password"
                id="senha"
                name="senha"
                class="form-control"
                placeholder="Digite sua senha"
                required
                minlength="8"
            >
        </div>

        <div class="mb-3">
            <label for="confirmar-senha" class="form-label">
                Confirmar senha:
            </label>
            <input
                type="password"
                id="confirmar-senha"
                name="confirmar-senha"
                class="form-control"
                placeholder="Confirme sua senha"
                required
                minlength="8"
            >
        </div>

        <button type="submit" class="btn btn-primary">
            Cadastrar
        </button>

        <button type="reset" class="btn btn-secondary">
            Limpar
        </button>
    </form>
</section>


</body>
</html>
