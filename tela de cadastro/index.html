
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Menu de navegação -->
    <nav>
        <a href="#">Home</a>
        <a href="#cadastro">Cadastre-se</a>
        <a href="#login">Login</a>
        <a href="#abrigos">Abrigos</a>
    </nav>

    <!-- Seção de cadastro -->
    <section id="cadastro" class="mb-5">

        <h2>Cadastro</h2>

        <form id="form-cadastro">

            <!-- Nome completo -->
            <div class="mb-3">
                <label for="nome" class="form-label">
                    Nome completo:
                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    class="form-control"
                    placeholder="Digite seu nome completo"
                    required
                >
            </div>

            <!-- CPF ou CNPJ -->
            <div class="mb-3">
                <label for="cpf-cnpj" class="form-label">
                    CPF/CNPJ:
                </label>

                <input
                    type="text"
                    id="cpf-cnpj"
                    name="cpf-cnpj"
                    class="form-control"
                    placeholder="Digite seu CPF ou CNPJ"
                    required
                >
            </div>

            <!-- E-mail -->
            <div class="mb-3">
                <label for="email" class="form-label">
                    E-mail:
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="Digite seu e-mail"
                    required
                >
            </div>

            <!-- Senha -->
            <div class="mb-3">
                <label for="senha" class="form-label">
                    Senha:
                </label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    class="form-control"
                    placeholder="Digite sua senha"
                    minlength="8"
                    required
                >
            </div>

            <!-- Confirmar senha -->
            <div class="mb-3">
                <label for="confirmar-senha" class="form-label">
                    Confirmar senha:
                </label>

                <input
                    type="password"
                    id="confirmar-senha"
                    name="confirmar-senha"
                    class="form-control"
                    placeholder="Confirme sua senha"
                    minlength="8"
                    required
                >
            </div>

            <!-- Seleção de perfil -->
            <div class="mb-3">

                <h3>Selecione seu perfil:</h3>

                <label>
                    <input
                        type="radio"
                        name="perfil"
                        value="doador"
                        required
                    >
                    Doador
                </label>

                <br>

                <label>
                    <input
                        type="radio"
                        name="perfil"
                        value="donatario"
                    >
                    Donatário
                </label>

            </div>

            <!-- Botões -->
            <button type="submit" class="btn btn-primary">
                Cadastrar
            </button>

            <button type="reset" class="btn btn-secondary">
                Limpar
            </button>

        </form>

    </section>

</body>
</html>
